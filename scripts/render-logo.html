<!DOCTYPE html>
<html>
<head>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap');
    body {
      margin: 0;
      padding: 20px;
      background: transparent;
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      display: inline-flex;
      align-items: center;
    }
    .logo-container {
      display: flex;
      align-items: center;
      gap: 18px;
    }
    .icon-box {
      width: 72px;
      height: 72px;
      border-radius: 20px;
      background: linear-gradient(135deg, #4A7C59 0%, #3B5998 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(74, 124, 89, 0.25);
    }
    .brand-text {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .brand-title {
      font-size: 34px;
      font-weight: 800;
      color: #1E293B;
      letter-spacing: -0.03em;
      line-height: 1.1;
      display: flex;
      align-items: baseline;
      gap: 8px;
    }
    .brand-pwa {
      font-size: 18px;
      font-weight: 700;
      color: #4A7C59;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .brand-subtitle {
      font-size: 16px;
      font-weight: 600;
      color: #3B5998;
      margin-top: 4px;
      letter-spacing: -0.01em;
    }
  </style>
</head>
<body>
  <div class="logo-container" id="logo">
    <div class="icon-box">
      <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        <path d="m9 12 2 2 4-4"/>
      </svg>
    </div>
    <div class="brand-text">
      <div class="brand-title">
        SafeSpace <span class="brand-pwa">PWA</span>
      </div>
      <div class="brand-subtitle">Pra-Konseling &amp; Deteksi Burnout PJJ</div>
    </div>
  </div>
</body>
</html>
