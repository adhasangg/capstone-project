server {
  listen 80;
  server_name _;
  client_max_body_size 50M;

  # API reverse proxy to testing API container
  location /api/ {
    proxy_pass http://safespace-test-api:3000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 90s;
  }

  # Swagger docs proxy
  location /swagger {
    proxy_pass http://safespace-test-api:3000/swagger;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # Health check
  location = /health {
    proxy_pass http://safespace-test-api:3000/health;
  }

  # Strict no-cache for index.html, service worker, and webmanifest
  location ~* (index\.html|sw\.js|registerSW\.js|workbox-.*\.js|manifest\.webmanifest)$ {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    expires -1;
  }

  # Static assets with content hash (safe to cache long-term)
  location /assets/ {
    root /usr/share/nginx/html;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # SPA fallback with no-cache header
  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    expires -1;
  }
}
