server {
  listen 80;
  server_name _;
  client_max_body_size 50M;

  # API reverse proxy to testing API container
  location /api/ {
    proxy_pass http://safespace-test-api:3000/api/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 90s;
  }

  # Swagger docs proxy
  location /swagger {
    proxy_pass http://safespace-test-api:3000/swagger;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # Health check
  location = /health {
    proxy_pass http://safespace-test-api:3000/health;
  }

  # SPA fallback
  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }

  # Static assets cache
  location /assets/ {
    root /usr/share/nginx/html;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }
}
